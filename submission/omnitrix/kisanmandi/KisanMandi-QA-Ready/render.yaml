services:
  - type: web
    name: kisanmandi-hackathon-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: KISAN_PUBLIC_DEMO
        value: "1"
      - key: KISAN_SESSION_SECRET
        generateValue: true
      - key: KISAN_DB
        value: /tmp/kisanmandi.db
